<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./admin.js" type="module" defer></script>
  <style>
    body { direction: rtl; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ממשק מנהל</p>
        <h1>פאנל מחקר</h1>
        <p class="app-subtitle">יצירת הזמנות ומעקב אחר סטטוס משתתפים.</p>
      </div>
      <div class="session-badge">גישה מאובטחת</div>
    </header>

    <main class="layout layout-single">
      <section class="panel admin" id="admin-section">
        <div class="panel-header">
          <div>
            <h2>ניהול משתתפים</h2>
            <p class="muted">יצירת קישורי הזמנה ומעקב סטטוס.</p>
          </div>
        </div>

        <form id="invite-form" class="inline-form" style="font-family: inherit;">
          <label class="muted" for="session-select" style="font-family: inherit;">בחרו קבוצה (מפגש):</label>
          <select id="session-select" name="sessionNumber" style="font-family: inherit; font-size: 1rem; padding: 0.5em; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #222;"></select>
          <button type="submit" style="font-family: inherit; font-size: 1rem; padding: 0.5em 1em; border-radius: 6px; border: none; background: #2d7ff9; color: #fff; cursor: pointer;">צור הזמנה</button>
        </form>

        <div id="invite-result" class="card muted"></div>

        <div class="column-toggles" id="participants-column-toggles"></div>

        <div class="table" id="participants-table"></div>
      </section>

      <section class="panel admin" id="forms-section">
        <div class="panel-header">
          <div>
            <h2>טפסים ונתונים</h2>
            <p class="muted">צפייה בתשובות וייצוא ל-CSV.</p>
          </div>
          <div class="button-row">
            <button class="ghost-button" id="download-all-forms">הורד הכל (CSV)</button>
            <button class="ghost-button" id="download-filtered-forms">הורד מסונן</button>
          </div>
        </div>

        <div class="form-controls">
          <label class="muted" for="form-filter">סינון לפי טופס:</label>
          <select id="form-filter" style="font-family: inherit;"></select>
          <button class="ghost-button" id="refresh-forms">רענן</button>
          <span class="muted" id="forms-summary"></span>
        </div>

        <div class="table" id="forms-table"></div>
      </section>

      <div class="modal" id="messages-modal" hidden>
        <div class="modal-backdrop" id="messages-modal-backdrop"></div>
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 id="messages-modal-title">הודעות משתתף</h3>
            <button class="ghost-button" id="messages-modal-close">סגור</button>
          </div>
          <div class="modal-body" id="messages-modal-body">
            <div class="placeholder">טוען הודעות...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
