<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  <script src="./admin.js" type="module" defer></script>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">ממשק מנהל</p>
        <h1>Admin Panel</h1>
      </div>
      <div class="pill">גישה מאובטחת</div>
    </header>

    <main class="admin-grid">
      <details class="panel-card" open>
        <summary>
          <h2>Subjects Panel</h2>
        </summary>
        <div class="panel-content">
          <div class="subjects-wrap" id="subjects-panel"></div>
        </div>
      </details>

      <details class="panel-card">
        <summary>
          <h2>Problem Panel</h2>
        </summary>
        <div class="panel-content">
          <div class="subjects-wrap" id="problems-panel"></div>
        </div>
      </details>

      <details class="panel-card">
        <summary>
          <h2>Management Panel</h2>
        </summary>
        <div class="panel-content">
          <form id="create-participant-form" class="admin-form">
            <select id="group-select" name="groupAssignment"></select>
            <button type="submit">צור משתתף חדש</button>
          </form>

          <form id="create-balanced-batch-form" class="admin-form">
            <button type="submit">צור באץ' מאוזן מינימלי (E/C לסירוגין)</button>
          </form>

          <form id="reset-session-form" class="admin-form">
            <input id="reset-session-token" name="token" type="text" required placeholder="Session token" />
            <button type="submit">אפס מפגש לפי token</button>
          </form>

          <form id="schedule-lock-form" class="admin-form">
            <input id="schedule-lock-token" name="token" type="text" required placeholder="Session token" />
            <select id="schedule-lock-mode" name="scheduleLockMode">
              <option value="disable">כבה נעילה אוטומטית אחרי 24 שעות</option>
              <option value="enable">הפעל נעילה אוטומטית אחרי 24 שעות</option>
            </select>
            <button type="submit">עדכן נעילת לו"ז</button>
          </form>

          <form id="delete-participant-form" class="admin-form">
            <input id="delete-participant-code" name="participantCode" type="text" required placeholder="Participant code" />
            <button class="danger" type="submit">מחק משתתף</button>
          </form>

          <div id="management-result" class="small-muted"></div>
        </div>
      </details>

      <details class="panel-card">
        <summary>
          <h2>QA Panel</h2>
          <div class="inline-actions">
            <select id="qa-group-filter">
              <option value="all">all</option>
              <option value="experimental">experimental</option>
              <option value="control">control</option>
            </select>
            <button class="tiny-btn" id="qa-refresh">רענן QA</button>
          </div>
        </summary>
        <div class="panel-content">
          <h3>Session per persona</h3>
          <div class="chart-grid" id="qa-session-per-persona"></div>

          <h3>Persona per session</h3>
          <div class="chart-grid" id="qa-persona-per-session"></div>
        </div>
      </details>
    </main>

    <div class="modal" id="participant-modal" hidden>
      <div class="modal-backdrop" id="participant-modal-backdrop"></div>
      <div class="modal-dialog">
        <div class="modal-top">
          <h3 id="participant-modal-title">Participant Details</h3>
          <div class="inline-actions">
            <label for="message-session-filter" class="small-muted">הצג מפגש:</label>
            <select id="message-session-filter">
              <option value="all">All sessions</option>
            </select>
            <button class="tiny-btn" id="participant-modal-close">סגור</button>
          </div>
        </div>
        <div class="detail-block" id="participant-session-details">
          <div class="small-muted">טוען נתוני מפגש...</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
